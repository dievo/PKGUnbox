name: Build PKGUnbox

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            zlib1g-dev \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools \
            libgl1-mesa-dev \
            python3-pil \
            wget \
            file

      - name: Build Crypto++ library
        run: |
          cd externals/cryptopp
          make -j$(nproc)

      - name: Configure CMake
        run: |
          cd extractor/build
          cmake --fresh .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: |
          cd extractor/build
          cmake --build . --config Release -j$(nproc)

      - name: Verify binaries
        run: |
          cd extractor/build
          echo "=== CLI ==="
          file ./pkgunbox
          ./pkgunbox --help || true
          echo ""
          echo "=== GUI ==="
          file ./pkgunbox-gui

      - name: Download linuxdeploy tools
        run: |
          cd extractor/build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

      - name: Create AppDir structure
        run: |
          cd extractor/build
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/pkgunbox/translations

          # Binaries
          cp pkgunbox AppDir/usr/bin/
          cp pkgunbox-gui AppDir/usr/bin/

          # Translations (.qm files)
          if ls translations/pkgunbox_*.qm 1>/dev/null 2>&1; then
            cp translations/pkgunbox_*.qm AppDir/usr/share/pkgunbox/translations/
            echo "Copied $(ls AppDir/usr/share/pkgunbox/translations/pkgunbox_*.qm | wc -l) translation files"
          else
            echo "WARNING: No .qm files found"
          fi

          # Desktop file
          cp ../pkgunbox.desktop AppDir/usr/share/applications/

          # Icon (resize 1024->512)
          python3 -c "
          from PIL import Image
          img = Image.open('../icon.png')
          img_resized = img.resize((512, 512), Image.LANCZOS)
          img_resized.save('AppDir/usr/share/icons/hicolor/512x512/apps/pkgunbox.png')
          print('Icon resized: 1024x1024 -> 512x512')
          "

          # AppRun symlink
          ln -sf usr/bin/pkgunbox-gui AppDir/AppRun

      - name: Build AppImage
        run: |
          cd extractor/build
          export DEPLOY_GTK_VERSION=3
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/pkgunbox.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/pkgunbox.png \
            --plugin qt \
            --output appimage

      - name: Rename AppImage with version
        id: version
        run: |
          cd extractor/build
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-$(git rev-parse --short HEAD 2>/dev/null || echo 'unknown')"
          fi
          APPIMAGE_FILE=$(ls -1 PKGUnbox*.AppImage | head -1)
          FINAL_NAME="PKGUnbox-linux-x86_64-${VERSION}.AppImage"
          mv "$APPIMAGE_FILE" "$FINAL_NAME"
          echo "appimage=$FINAL_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "=== AppImage Built ==="
          echo "File: $FINAL_NAME"
          ls -lh "$FINAL_NAME"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: PKGUnbox-Linux-${{ steps.version.outputs.version }}
          path: extractor/build/PKGUnbox-linux-x86_64-*.AppImage
          retention-days: 30

  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python-pillow
            git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Crypto++ library
        run: |
          cd externals/cryptopp
          mingw32-make -j$(nproc) CXX=g++

      - name: Generate Windows icon
        run: |
          cd extractor
          python3 -c "
          from PIL import Image
          img = Image.open('icon.png')
          img_resized = img.resize((256, 256), Image.LANCZOS)
          img_resized.save('gui/pkgunbox.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print('Generated gui/pkgunbox.ico')
          "

      - name: Configure CMake
        run: |
          cd extractor/build
          cmake -G "MinGW Makefiles" .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON

      - name: Build
        run: |
          cd extractor/build
          mingw32-make -j$(nproc)

      - name: Verify binaries
        run: |
          cd extractor/build
          echo "=== CLI ==="
          ./pkgunbox.exe --help || true
          echo ""
          echo "=== GUI ==="
          file ./pkgunbox-gui.exe

      - name: Deploy Qt6 dependencies
        run: |
          cd extractor/build
          mkdir -p PKGUnbox-Windows
          cp pkgunbox.exe PKGUnbox-Windows/
          cp pkgunbox-gui.exe PKGUnbox-Windows/

          # Copy translations
          mkdir -p PKGUnbox-Windows/translations
          cp translations/pkgunbox_*.qm PKGUnbox-Windows/translations/ 2>/dev/null || true

          # Copy icon — generate .ico for Windows
          python3 -c "
          from PIL import Image
          img = Image.open('../icon.png')
          img_resized = img.resize((256, 256), Image.LANCZOS)
          img_resized.save('PKGUnbox-Windows/pkgunbox.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          img_resized.save('PKGUnbox-Windows/pkgunbox.png')
          print('Icon generated: pkgunbox.ico + pkgunbox.png')
          "

          # Use windeployqt to copy Qt DLLs
          windeployqt PKGUnbox-Windows/pkgunbox-gui.exe

          # Copy MinGW runtime DLLs
          cp /mingw64/bin/libgcc_s_seh-1.dll PKGUnbox-Windows/ 2>/dev/null || true
          cp /mingw64/bin/libstdc++-6.dll PKGUnbox-Windows/ 2>/dev/null || true
          cp /mingw64/bin/libwinpthread-1.dll PKGUnbox-Windows/ 2>/dev/null || true

          # Copy ALL common DLLs from MinGW to avoid missing dependency errors
          for dll in zlib1 libpng16-16 libjpeg-8 libtiff-6 libwebp-7 \
                     libbz2-1 libfreetype-6 libharfbuzz-0 libpcre2-16-0 \
                     libintl-8 libiconv-2 libmd4c; do
            cp "/mingw64/bin/${dll}.dll" PKGUnbox-Windows/ 2>/dev/null || true
          done

          # Copy any remaining Qt/image DLLs that windeployqt might have missed
          cp /mingw64/bin/libpng*.dll PKGUnbox-Windows/ 2>/dev/null || true
          cp /mingw64/bin/libmd*.dll PKGUnbox-Windows/ 2>/dev/null || true

          # Strip symbols
          strip -s PKGUnbox-Windows/*.exe PKGUnbox-Windows/*.dll 2>/dev/null || true

          echo "=== Windows package contents ==="
          ls -lh PKGUnbox-Windows/

      - name: Calculate version
        id: version
        shell: pwsh
        run: |
          cd extractor/build
          if ("${{ github.ref }}" -match "refs/tags/v") {
            $VERSION = "${{ github.ref_name }}"
          } else {
            $VERSION = "dev-$(git rev-parse --short HEAD 2>$null)"
          }
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "=== Version: $VERSION ==="

      - name: Rename folder with version
        shell: pwsh
        run: |
          cd extractor/build
          $VERSION = "${{ steps.version.outputs.version }}"
          $FINAL_NAME = "PKGUnbox-Windows-x64-${VERSION}"
          Rename-Item -Path "PKGUnbox-Windows" -NewName "$FINAL_NAME"
          echo "=== Package contents ==="
          Get-ChildItem "$FINAL_NAME" | Select-Object Name, @{N='Size';E={'{0:N1} MB' -f ($_.Length/1MB)}}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PKGUnbox-Windows-${{ steps.version.outputs.version }}
          path: extractor/build/PKGUnbox-Windows-x64-${{ steps.version.outputs.version }}
          retention-days: 30

  release:
    needs: [build-appimage, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/

      - name: Package Windows release ZIP
        run: |
          cd release
          # download-artifact uses artifact NAME as folder: PKGUnbox-Windows-<version>
          WIN_DIR=$(find . -maxdepth 1 -type d -name 'PKGUnbox-Windows-*' | head -1)
          echo "Windows folder: $WIN_DIR"
          if [ -n "$WIN_DIR" ]; then
            ZIP_NAME="PKGUnbox-Windows-x64-${{ github.ref_name }}.zip"
            (cd "$WIN_DIR" && zip -r "../${ZIP_NAME}" .)
            echo "Created: ${ZIP_NAME}"
            ls -lh "${ZIP_NAME}"
          else
            echo "ERROR: Windows folder not found!"
            find . -type d
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.AppImage
            release/**/*.zip
          body: |
            ## PKGUnbox ${{ github.ref_name }}

            **Unbox your PS4 games. Done.**

            A standalone tool that extracts PS4 `.pkg` files — base games, updates, and DLCs.
            No bloat. No library management. Just extract and play.

            ### What is PKGUnbox?

            The [shadPS4 emulator](https://github.com/shadps4-emu/shadPS4) removed PKG extraction from its core to focus on emulation. **PKGUnbox fills that gap** — a dedicated companion tool for preparing your game files.

            ### ✨ Features

            - **Drag & Drop** — Drop a `.pkg` file directly onto the window
            - **Auto Detection** — Automatically detects PKG type (base, update, DLC)
            - **Progress Bar** — Visual feedback during extraction
            - **Copy Log** — One-click copy of the full extraction log
            - **Dark Theme** — Easy on the eyes, with blurple accent colors
            - **Multi-language** — English, Português, Español
            - **Save Directories** — Remember your Games/DLCs paths across sessions
            - **CLI Mode** — For power users and scripting

            ### 📦 Downloads

            | Platform | File | Requirements |
            |----------|------|-------------|
            | **Linux** | `PKGUnbox-linux-x86_64-${{ github.ref_name }}.AppImage` | None (self-contained) |
            | **Windows** | `PKGUnbox-Windows-x64-${{ github.ref_name }}.zip` | Windows 10+ |

            ### 🚀 Quick Start

            **Linux:**
            ```bash
            chmod +x PKGUnbox-linux-x86_64-${{ github.ref_name }}.AppImage
            ./PKGUnbox-linux-x86_64-${{ github.ref_name }}.AppImage
            ```

            **Windows:**
            Extract the `.zip` and double-click `pkgunbox-gui.exe`.

            **CLI:**
            ```bash
            ./pkgunbox /path/to/file.pkg /path/to/output/
            ./pkgunbox /path/to/file.pkg --check-type  # 101=base, 102=update, 103=DLC
            ```

            ### 🏗️ Building from Source

            See [README](https://github.com/dievo/PKGUnbox/blob/main/README.md) for full build instructions.

            ### 📝 License

            GPL-2.0-or-later

            ---

            *PKGUnbox is intended for extracting PKG files that you legally own. Use responsibly.*
          generate_release_notes: false
          draft: false
          prerelease: false
